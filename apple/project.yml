# Xcode project for the AirUSB Hub importer.
#
# It exists for a reason that is not "we wanted an IDE": an App ID must exist in
# the Developer portal before the Capability Requests tab exists at all, and the
# only non-manual way to register one is Xcode's automatic signing, which calls
# the Developer API on your behalf.
#
# Generated from this file with `xcodegen`, so the project is reviewable as text
# and a regenerated .xcodeproj is never a mystery diff.
name: AirUSBHub

options:
  bundleIdPrefix: com.otti83
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"

settings:
  base:
    DEVELOPMENT_TEAM: GZUV3UMV3B
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AirUSBHub:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: AirUSB Hub
        CFBundleDisplayName: AirUSB Hub
        LSUIElement: true          # no Dock icon; this is a probe, not an app yet
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.otti83.airusbhub
        CODE_SIGN_ENTITLEMENTS: Sources/AirUSBHub.entitlements
        # NOTE: com.apple.developer.usb.host-controller-interface is deliberately
        # NOT in that file yet. It is Apple-managed; claiming it before the grant
        # makes automatic signing fail, which would stop the App ID being
        # registered — the exact thing this project exists to do. It goes in
        # after the grant, in one line.
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - sdk: IOKit.framework
      - sdk: IOUSBHost.framework
      - sdk: Foundation.framework
