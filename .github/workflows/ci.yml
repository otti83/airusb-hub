# AirUSB Hub — continuous integration.
#
# This file exists to answer one question that no amount of reading could settle:
# does the portable half of this project actually build and run on Windows with
# MSVC? Cross-compiling with MinGW proved headers, APIs and linkage, and found
# four real defects doing it — but MinGW is still GCC, and it shares GCC's
# permissiveness. MSVC under /permissive- is a different compiler with a
# different standard library, and until this workflow ran, nobody had ever
# pointed it at these sources.
#
# The Windows job therefore does three things in order, each strictly stronger
# than the last:
#
#   1. compiles every portable target with MSVC
#   2. runs the unit suites natively on Windows
#   3. runs a complete encrypted session over a real loopback socket and requires
#      a USB Mass Storage exchange to complete
#
# Step 3 is the one that matters. It is the same BOT probe that drove a physical
# drive during the P2.8 hardware gate, so a failure there means Windows is wrong,
# not that the instrument is.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: airusb

jobs:
  # ---------------------------------------------------------------------------
  # THE POINT OF THIS FILE.
  # ---------------------------------------------------------------------------
  windows-msvc:
    name: Windows / MSVC 2022
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions (evidence, not decoration)
        shell: pwsh
        run: |
          cmake --version
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version | Format-List

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      # "Built with MSVC" is a claim; this is the line that supports it. Read the
      # identity out of CMake's own cache rather than invoking cl.exe for its
      # banner — cl.exe with no input files exits non-zero, which would fail this
      # step for no reason.
      - name: Record the compiler actually used
        shell: pwsh
        run: |
          Select-String -Path build\CMakeCache.txt -Pattern '^CMAKE_CXX_COMPILER:'
          Get-ChildItem -Recurse -Filter CMakeCXXCompiler.cmake build\CMakeFiles |
            ForEach-Object { Select-String -Path $_.FullName -Pattern 'COMPILER_ID|COMPILER_VERSION' }

      - name: Unit suites, natively on Windows
        shell: pwsh
        working-directory: airusb/build
        run: ctest --build-config Release --output-on-failure

      # ---------------------------------------------------------------------
      # A complete session over a real socket. serve and connect default to
      # separate identity and pin files, so both halves can share one machine
      # without one clobbering the other's trust store.
      #
      # At least two connects are always needed, and that is not flakiness: the
      # first is trust-on-first-use. The exporter pins the new peer and drops the
      # connection, because the grants were read at handshake time and pretending
      # they applied mid-session would be a lie. Only a later connect can attach.
      # Verified locally on macOS: attempt 1 exits 3 and pairs, attempt 2 exits 0
      # with RESULT=PASS.
      # ---------------------------------------------------------------------
      - name: A USB Mass Storage exchange, read AND write, over a loopback session
        shell: pwsh
        run: |
          # Absolute: Start-Process resolves a relative path against the host
          # process's directory, which is not necessarily PowerShell's location.
          if (-not (Test-Path .\build\Release\airusb-net.exe)) {
            Get-ChildItem -Recurse -Filter airusb-net.exe build | ForEach-Object { Write-Host $_.FullName }
            throw "airusb-net.exe was not where the documented procedure says it is"
          }
          $exe = (Resolve-Path .\build\Release\airusb-net.exe).Path

          $server = Start-Process -FilePath $exe `
            -ArgumentList 'serve','--port','7714' `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput 'serve.out' -RedirectStandardError 'serve.err'

          try {
            # Deliberately NOT a port-readiness probe. A bare TCP connect is
            # ACCEPTED by the exporter, which then sits in its handshake loop
            # waiting for a preamble that never comes — so probing the port
            # perturbs the thing it is measuring. Retrying the real client
            # instead is race-free: an attempt made before the listener is up
            # simply fails to connect and is retried.
            #
            # It also absorbs the pairing round without special-casing it. The
            # first attempt that reaches the exporter pins the peer and is
            # dropped; the next one attaches. Success is defined only as
            # exit 0 AND RESULT=PASS in the transcript.
            $passed = $false
            foreach ($attempt in 1..12) {
              Write-Host "--- connect attempt $attempt ---"
              # --write-test implies --probe and adds the host->device half.
              # Until this landed, bulkOut had only ever carried 31-byte CBWs.
              $out = & $exe connect --host 127.0.0.1 --port 7714 --write-test 2>&1
              $code = $LASTEXITCODE
              $out | ForEach-Object { Write-Host $_ }
              Write-Host "exit $code"
              if ($code -eq 0 -and ($out -match 'RESULT=PASS')) {
                $passed = $true
                $segLine = $out | Select-String -Pattern 'SEGMENTATION ' | Select-Object -First 1
                break
              }
              if ($server.HasExited) { throw "the exporter died (exit $($server.ExitCode))" }
              Start-Sleep -Milliseconds 500
            }
            if (-not $passed) { throw "no attempt produced exit 0 with RESULT=PASS" }

            # The claim this job exists to support is not "Windows ran the
            # protocol" — it is "Windows ran THIS protocol", including the
            # segmentation that was wired into ExporterSession and
            # RemoteDevicePort after the last Windows run. Until the write
            # probe's largest run went past 65 519, every end-to-end transfer
            # fitted inside one record, so the segmented path had never
            # executed on Windows at all while this job reported PASS.
            #
            # RESULT=PASS already fails if segmentation did not fire, because
            # the tool gates on it. This is the second lock: it makes the
            # evidence visible in the log rather than implied by an exit code.
            if (-not $segLine) { throw "the run produced no SEGMENTATION line" }
            Write-Host "segmentation evidence: $segLine"
            if ($segLine -notmatch 'fired=yes') {
              throw "segmentation did not fire on Windows: $segLine"
            }
            Write-Host 'PASS: a USB Mass Storage exchange completed on Windows, segmented.'
          }
          finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
            Write-Host '--- exporter stdout ---'
            if (Test-Path serve.out) { Get-Content serve.out }
            Write-Host '--- exporter stderr ---'
            if (Test-Path serve.err) { Get-Content serve.err }
          }

      # ---------------------------------------------------------------------
      # The window, on Windows, as two real processes.
      #
      # There is no Windows machine this project can drive interactively — the
      # one it has is reachable by RDP and nothing else — so every claim about
      # the interface on Windows would otherwise be "it compiles". This makes
      # two daemons pair with each other over loopback and read a device
      # through the control API, using a client that is not the one that wrote
      # the server.
      #
      # PowerShell, not bash, on purpose: the GitHub runner has both, and the
      # bash one would test a POSIX shell's idea of Windows rather than
      # Windows. CP932 already caught this project out once (§ the em dash in
      # the SAS line), and the SAS is exactly what this step reads back.
      # ---------------------------------------------------------------------
      - name: The hub daemon, two processes, driven over its own HTTP API
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\build\Release\airusb-hubd.exe).Path
          New-Item -ItemType Directory -Force -Path hubA, hubB | Out-Null

          $a = Start-Process -FilePath $exe -WorkingDirectory (Resolve-Path hubA) `
                 -ArgumentList '--ui-port','8801','--share-port','7745','--share',
                               '--no-open','--name','sharer' `
                 -PassThru -NoNewWindow -RedirectStandardOutput hubA.out -RedirectStandardError hubA.err
          $b = Start-Process -FilePath $exe -WorkingDirectory (Resolve-Path hubB) `
                 -ArgumentList '--ui-port','8802','--no-open','--name','importer' `
                 -PassThru -NoNewWindow -RedirectStandardOutput hubB.out -RedirectStandardError hubB.err

          try {
            foreach ($i in 1..50) {
              if ((Test-Path hubA\airusb-hub.token) -and (Test-Path hubB\airusb-hub.token)) { break }
              Start-Sleep -Milliseconds 200
            }
            $TA = (Get-Content hubA\airusb-hub.token -Raw).Trim()
            $TB = (Get-Content hubB\airusb-hub.token -Raw).Trim()
            $hA = @{ 'X-AirUSB-Token' = $TA }
            $hB = @{ 'X-AirUSB-Token' = $TB }

            function Get-State($port, $hdr) {
              Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/state" -Headers $hdr
            }
            function Post($port, $hdr, $path, $body) {
              Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$port/api/$path" `
                -Headers $hdr -ContentType 'application/json' -Body $body
            }

            # The refusals first. A guard whose checks have quietly stopped
            # firing looks exactly like one that is working.
            $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8801/api/state' -SkipHttpErrorCheck
            if ($r.StatusCode -ne 401) { throw "a request with no token got $($r.StatusCode), wanted 401" }
            $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8801/api/state' `
                   -Headers (@{ 'X-AirUSB-Token' = $TA; 'Host' = 'rebind.example:8801' }) -SkipHttpErrorCheck
            if ($r.StatusCode -ne 403) { throw "the Host check did not fire ($($r.StatusCode))" }
            $r = Invoke-WebRequest -Method Post -Uri 'http://127.0.0.1:8801/api/share/stop' `
                   -Headers (@{ 'X-AirUSB-Token' = $TA; 'Origin' = 'https://evil.example' }) -SkipHttpErrorCheck
            if ($r.StatusCode -ne 403) { throw "the Origin check did not fire ($($r.StatusCode))" }
            $page = Invoke-WebRequest -Uri 'http://127.0.0.1:8801/'
            if ($page.Content -notmatch '<title>AirUSB Hub</title>') { throw "the page was not served" }
            Write-Host "guard: no-token 401, rebinding 403, cross-origin 403, page $($page.RawContentLength) bytes"

            Post 8802 $hB 'import/connect' '{"host":"127.0.0.1","port":7745}' | Out-Null
            $sasB = (Get-State 8802 $hB).import.sas
            $sasA = (Get-State 8801 $hA).share.sas
            Write-Host "importer $sasB / sharer $sasA"
            if (-not $sasA -or $sasA -ne $sasB) { throw "the two sides showed different numbers" }

            # Exporter first — the order that tears the session down while the
            # other side is still deciding, and the one a naive implementation
            # never recovers from.
            Post 8801 $hA 'share/approve' '{"accept":true}' | Out-Null
            $ok = $false
            foreach ($i in 1..40) {
              Start-Sleep -Milliseconds 500
              $im = (Get-State 8802 $hB).import
              Write-Host "  importer $($im.state) sas=$($im.sas)"
              if ($im.state -eq 'awaiting-approval' -and $im.sas -and $im.sas -ne $sasB) {
                $sh = (Get-State 8801 $hA).share
                if ($sh.sas -ne $im.sas) { throw "after the reconnect the numbers disagree" }
                Write-Host "  reconnected with a new number, matching on both sides: $($im.sas)"
                Post 8802 $hB 'import/approve' '{"accept":true}' | Out-Null
              }
              if ($im.state -eq 'connected' -or $im.state -eq 'attached') { $ok = $true; break }
            }
            if (-not $ok) { throw "the two hubs never finished pairing" }

            $uid = (Get-State 8802 $hB).import.devices[0].uid
            if (-not $uid) { throw "the sharer offered nothing" }
            Post 8802 $hB 'import/attach' (@{ uid = $uid } | ConvertTo-Json -Compress) | Out-Null
            $res = Post 8802 $hB 'import/verify' '{}'
            if (-not $res.import.probe.passed) { throw "the verification failed: $($res.import.probe.failure)" }
            Write-Host "device: $($res.import.manifest)"
            Write-Host "probe : $($res.import.probe.summary.Split([char]10)[0])"
            Write-Host 'PASS: two hubs paired on Windows and read a device through the control API.'
          }
          finally {
            foreach ($p in @($a, $b)) {
              if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            }
            foreach ($f in @('hubA.out','hubA.err','hubB.out','hubB.err')) {
              if (Test-Path $f) { Write-Host "--- $f ---"; Get-Content $f }
            }
          }

      - name: Publish the binary MSVC actually produced
        uses: actions/upload-artifact@v4
        with:
          name: airusb-net-msvc-x64
          path: airusb/build/Release/airusb-net.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux, with AddressSanitizer.
  #
  # ASan runs HERE and not on macOS because any -fsanitize=address binary hangs
  # before main() on the development Mac — bisected: `fuzzer` works,
  # `fuzzer,undefined` works, `address` hangs. UBSan does not catch heap
  # out-of-bounds, which is precisely what the R2/R5/R6 validation rules exist to
  # stop, so a build that actually runs ASan has to exist somewhere.
  # ---------------------------------------------------------------------------
  linux-asan:
    name: Linux / GCC + ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with sanitizers
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build -j
      - name: Unit suites under ASan
        working-directory: airusb/build
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --output-on-failure

      - name: A USB Mass Storage exchange, read AND write, over a loopback session
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          # pipefail matters here: without it `client | tee` reports tee's status,
          # which always succeeds, and the client's exit code would go unchecked.
          set -u -o pipefail
          ./build/airusb-net serve --port 7714 > serve.out 2> serve.err &
          server=$!
          trap 'kill $server 2>/dev/null || true; echo "--- exporter ---"; cat serve.out serve.err' EXIT

          # Same reasoning as the Windows job: retry the real client rather than
          # probing the port, because a bare connect is accepted by the exporter
          # and stalls its handshake loop. The pairing round is absorbed by the
          # retry instead of being special-cased.
          passed=0
          for attempt in $(seq 1 12); do
            echo "--- connect attempt $attempt ---"
            if ./build/airusb-net connect --host 127.0.0.1 --port 7714 --write-test 2>&1 \
                 | tee attempt.out && grep -q 'RESULT=PASS' attempt.out; then
              passed=1; break
            fi
            kill -0 $server 2>/dev/null || { echo "the exporter died"; break; }
            sleep 0.5
          done
          [ "$passed" = 1 ] || { echo "no attempt produced RESULT=PASS"; exit 1; }

          # Same gate as the Windows job, and here it also means ASan watched a
          # 128 KiB transfer be split, reassembled and compared byte for byte.
          # The reassembly buffers are exactly the place a heap overrun would
          # live, and UBSan alone would not see one.
          grep 'SEGMENTATION ' attempt.out || { echo "no SEGMENTATION line"; exit 1; }
          grep -q 'SEGMENTATION .*fired=yes' attempt.out || {
            echo "segmentation did not fire"; exit 1; }

      # -----------------------------------------------------------------
      # The product's own interface, as two real processes.
      #
      # test_hub_e2e already runs the pairing state machine on every OS, but
      # it does it in one process with the HTTP layer bypassed. This is the
      # other half: two daemons, two token files, real loopback sockets, and
      # a client that is not the one that wrote the server — curl. Under ASan,
      # so the request parser is watched while a stranger's bytes go through
      # it.
      # -----------------------------------------------------------------
      - name: The hub daemon, two processes, driven over its own HTTP API
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -eu -o pipefail
          bin="$PWD/build/airusb-hubd"
          mkdir -p /tmp/hubA /tmp/hubB

          (cd /tmp/hubA && "$bin" --ui-port 8801 --share-port 7745 --share \
              --no-open --name sharer > hub.log 2>&1) &
          (cd /tmp/hubB && "$bin" --ui-port 8802 --no-open --name importer \
              > hub.log 2>&1) &
          trap 'pkill -f airusb-hubd || true; echo "--- A ---"; cat /tmp/hubA/hub.log;
                echo "--- B ---"; cat /tmp/hubB/hub.log' EXIT
          for i in $(seq 1 50); do
            [ -s /tmp/hubA/airusb-hub.token ] && [ -s /tmp/hubB/airusb-hub.token ] && break
            sleep 0.2
          done
          TA=$(cat /tmp/hubA/airusb-hub.token); TB=$(cat /tmp/hubB/airusb-hub.token)
          A() { curl -sS -H "X-AirUSB-Token: $TA" -H 'Content-Type: application/json' "$@"; }
          B() { curl -sS -H "X-AirUSB-Token: $TB" -H 'Content-Type: application/json' "$@"; }

          # The guard, before anything else. A control plane whose refusals
          # have stopped working is worse than one that is down, because it
          # looks fine.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8801/api/state)
          [ "$code" = 401 ] || { echo "no-token request got $code, wanted 401"; exit 1; }
          curl -s -H "Host: rebind.example:8801" -H "X-AirUSB-Token: $TA" \
               http://127.0.0.1:8801/api/state | grep -q 'Host header' \
            || { echo "the Host check did not fire"; exit 1; }
          curl -s -X POST -H "Origin: https://evil.example" -H "X-AirUSB-Token: $TA" \
               http://127.0.0.1:8801/api/share/stop | grep -q 'cross-origin' \
            || { echo "the Origin check did not fire"; exit 1; }
          curl -s http://127.0.0.1:8801/ | grep -q '<title>AirUSB Hub</title>' \
            || { echo "the page was not served"; exit 1; }

          B -X POST -d '{"host":"127.0.0.1","port":7745}' \
            http://127.0.0.1:8802/api/import/connect > /dev/null
          sasB=$(B http://127.0.0.1:8802/api/state | grep -o '"sas":"[0-9]*"' | head -1)
          sasA=$(A http://127.0.0.1:8801/api/state | grep -o '"sas":"[0-9]*"' | head -1)
          echo "importer $sasB / sharer $sasA"
          [ -n "$sasA" ] && [ "$sasA" = "$sasB" ] \
            || { echo "the two sides showed different numbers"; exit 1; }

          B -X POST -d '{"accept":true}' http://127.0.0.1:8802/api/import/approve > /dev/null
          A -X POST -d '{"accept":true}' http://127.0.0.1:8801/api/share/approve > /dev/null

          for i in $(seq 1 40); do
            state=$(B http://127.0.0.1:8802/api/state | grep -o '"state":"[a-z-]*"' | sed -n 2p)
            echo "  importer $state"
            case "$state" in *connected*) break;; esac
            sleep 0.5
          done
          uid=$(B http://127.0.0.1:8802/api/state | grep -o '"uid":"[0-9a-f]*"' | head -1 |
                cut -d'"' -f4)
          [ -n "$uid" ] || { echo "the sharer offered nothing"; exit 1; }
          B -X POST -d "{\"uid\":\"$uid\"}" http://127.0.0.1:8802/api/import/attach > /dev/null
          B -X POST -d '{}' http://127.0.0.1:8802/api/import/verify > verify.json
          grep -q '"passed":true' verify.json \
            || { echo "the verification failed:"; cat verify.json; exit 1; }
          echo 'PASS: paired over the control API and read the device through it.'

  # ---------------------------------------------------------------------------
  # macOS. The development platform, and the only one with the real exporter.
  # The IOKit half is not exercised here — it needs a physical device and root —
  # but everything portable is, and the Objective-C++ half must still compile.
  # ---------------------------------------------------------------------------
  macos:
    name: macOS / Clang
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build -j
      - working-directory: airusb/build
        run: ctest --output-on-failure

  # ---------------------------------------------------------------------------
  # The MinGW cross-build. Kept in CI because it is the cheapest way to catch a
  # Windows portability regression from a Mac, and because the prebuilt binary
  # published for people without Visual Studio comes out of exactly this script.
  # ---------------------------------------------------------------------------
  windows-cross:
    name: Windows / MinGW cross-build from Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Cross-compile
        env:
          MINGW_CXX: x86_64-w64-mingw32-g++-posix
        run: ./scripts/cross-build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: airusb-net-mingw-x64
          path: airusb/build-win/airusb-net.exe
          if-no-files-found: error
